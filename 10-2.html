<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 幻灯片展示</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #eef2f7;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        .slideshow {
            width: min(900px, 90vw);
            overflow: hidden;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(20, 30, 50, 0.16);
        }

        .slideshow__image {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #d9e1ea;
        }

        .slideshow__image img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: slideshow 9s ease-in-out infinite;
        }

        .slideshow__image img:nth-child(1) {
            animation-delay: 0s;
        }

        .slideshow__image img:nth-child(2) {
            animation-delay: 3s;
        }

        .slideshow__image img:nth-child(3) {
            animation-delay: 6s;
        }

        .slideshow__caption {
            padding: 20px 24px;
            text-align: center;
            color: #263238;
        }

        .slideshow__caption h1 {
            margin: 0 0 8px;
            font-size: clamp(1.4rem, 4vw, 2rem);
        }

        .slideshow__caption p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }

        @keyframes slideshow {
            0%, 8% {
                opacity: 1;
            }
            16%, 88% {
                opacity: 0;
            }
            92%, 100% {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .slideshow__caption {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <main class="slideshow" aria-label="袁磊图片幻灯片">
        <div class="slideshow__image">
            <img src="img/1.jpg" alt="图片一">
            <img src="img/2.jpg" alt="图片二">
            <img src="img/3.jpg" alt="图片三">
        </div>
        <div class="slideshow__caption">
            <h1>袁磊</h1>
            <p>基于 CSS animation 的幻灯片展示</p>
        </div>
    </main>
</body>
</html>
