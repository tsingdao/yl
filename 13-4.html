<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>移动端底部导航 — SVG 图标</title>
    <script src="./cdn/lucide.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .mobile-frame {
            width: 100%;
            background: #fff;
            min-height: 100vh;
            position: relative;
        }

        .status-bar {
            height: 44px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid #f0f0f0;
        }

        .header {
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .content {
            padding: 32px 20px;
            min-height: calc(100vh - 170px);
        }

        .content .card {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .content .card h3 {
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
        }

        .content .card p {
            font-size: 13px;
            color: #999;
            line-height: 1.6;
        }

        .info-section {
            margin-top: 32px;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 16px;
            color: #fff;
        }

        .info-section h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .info-section p {
            font-size: 13px;
            opacity: .85;
            line-height: 1.6;
        }

        .icon-list {
            margin-top: 24px;
        }

        .icon-list h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
        }

        .icon-grid {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .icon-item svg {
            width: 28px;
            height: 28px;
            color: #f5576c;
        }

        .icon-item span {
            font-size: 11px;
            color: #999;
        }

        /* ===== 底部导航栏 ===== */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(255, 255, 255, .98);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            padding-bottom: env(safe-area-inset-bottom, 8px);
            box-shadow: 0 -1px 0 rgba(0,0,0,.06), 0 -4px 20px rgba(0,0,0,.06);
            z-index: 1000;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 100%;
            cursor: pointer;
            position: relative;
            text-decoration: none;
            color: #999;
            transition: color .25s ease;
        }

        .tab-item svg {
            width: 24px;
            height: 24px;
            position: relative;
            transition: transform .25s ease;
        }

        .tab-item span {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: .02em;
        }

        .tab-item.active {
            color: #f5576c;
        }

        .tab-item.active svg {
            transform: scale(1.1);
        }

        /* 数字徽章 */
        .badge {
            position: absolute;
            top: 8px;
            right: calc(50% - 28px);
            min-width: 18px;
            height: 18px;
            background: #ff3b30;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            padding: 0 5px;
            box-shadow: 0 2px 8px rgba(255, 59, 48, .4);
        }

        .badge-more {
            position: absolute;
            top: 8px;
            right: calc(50% - 32px);
            min-width: 18px;
            height: 18px;
            background: #ff3b30;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            padding: 0 5px;
            box-shadow: 0 2px 8px rgba(255, 59, 48, .4);
        }

        /* 红点 */
        .dot {
            position: absolute;
            top: 10px;
            right: calc(50% - 24px);
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, .9);
        }

        /* 中间凸起按钮 */
        .tab-item.center-item {
            position: relative;
        }

        .tab-item.center-item svg {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 50%;
            padding: 12px;
            color: #fff;
            box-shadow: 0 4px 16px rgba(245, 87, 108, .4);
            transform: translateY(-8px);
        }

        .tab-item.center-item span {
            transform: translateY(-4px);
        }

        /* 交互动画 */
        @keyframes bounce {
            0%, 100% { transform: scale(1.1); }
            50% { transform: scale(1.25); }
        }

        .tab-item.active svg {
            animation: bounce .3s ease;
        }
    </style>
</head>
<body>
    <div class="mobile-frame">
        <div class="status-bar">9:41</div>

        <header class="header">
            <h1>SVG 图标导航</h1>
        </header>

        <main class="content">
            <div class="card">
                <h3>Lucide SVG 图标</h3>
                <p>底部导航使用 Lucide 图标库（SVG 方式），通过 data-lucide 属性在运行时生成内联 SVG。</p>
            </div>

            <div class="info-section">
                <h2>SVG 图标特点</h2>
                <p>SVG 图标是独立的矢量图形，每个图标由路径组成，可通过 CSS 精确控制每个部分的颜色、描边宽度等属性，支持更灵活的样式定制。</p>
            </div>

            <div class="icon-list">
                <h3>本页面使用的图标</h3>
                <div class="icon-grid">
                    <div class="icon-item">
                        <i data-lucide="home"></i>
                        <span>首页</span>
                    </div>
                    <div class="icon-item">
                        <i data-lucide="search"></i>
                        <span>搜索</span>
                    </div>
                    <div class="icon-item">
                        <i data-lucide="plus-circle"></i>
                        <span>发布</span>
                    </div>
                    <div class="icon-item">
                        <i data-lucide="compass"></i>
                        <span>发现</span>
                    </div>
                    <div class="icon-item">
                        <i data-lucide="user"></i>
                        <span>我的</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- 底部导航 -->
        <nav class="tab-bar">
            <a class="tab-item active" href="javascript:void(0)">
                <i data-lucide="home"></i>
                <span>首页</span>
            </a>
            <a class="tab-item" href="javascript:void(0)">
                <i data-lucide="search"></i>
                <span>搜索</span>
                <span class="badge">3</span>
            </a>
            <a class="tab-item center-item" href="javascript:void(0)">
                <i data-lucide="plus-circle"></i>
                <span>发布</span>
            </a>
            <a class="tab-item" href="javascript:void(0)">
                <i data-lucide="compass"></i>
                <span>发现</span>
                <span class="dot"></span>
            </a>
            <a class="tab-item" href="javascript:void(0)">
                <i data-lucide="user"></i>
                <span>我的</span>
                <span class="badge-more">99+</span>
            </a>
        </nav>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
