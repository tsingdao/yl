        body,h2,ul,p{
            padding:0;

        }

        #b{
            width:400px;
            height:400px;
            border:1px dashed #039;
            margin:50px auto 40px;
        
        }
        /* 扩展：完成c和d，边框用dotted，宽度为3px */

    </style>
</head>
<body>

    <div id="b">526袁磊</div>

    <div id="d">526袁磊</div>
</body>
