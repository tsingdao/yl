<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query 响应式盒子布局</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-width: 320px;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            padding: 24px;
            background: #f5f7fb;
            color: #263238;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .title {
            margin: 0 0 24px;
            text-align: center;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
        }

        .box-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 16px;
        }

        .box {
            min-height: 150px;
            display: grid;
            place-items: center;
            padding: 20px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(25, 40, 60, 0.1);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
        }

        .box:nth-child(1) { background: #ff6b6b; }
        .box:nth-child(2) { background: #ffd166; color: #5b4300; }
        .box:nth-child(3) { background: #4ecdc4; }
        .box:nth-child(4) { background: #6c63ff; }
        .box:nth-child(5) { background: #ff8fab; }
        .box:nth-child(6) { background: #4da3ff; }
        .box:nth-child(7) { background: #42c98b; }
        .box:nth-child(8) { background: #a66cff; }

        @media (min-width: 600px) {
            .box-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 800px) {
            .box-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (min-width: 1200px) {
            .box-grid {
                grid-template-columns: repeat(8, minmax(0, 1fr));
            }
        }

        @media (max-width: 599px) {
            body {
                padding: 16px;
            }

            .box {
                min-height: 110px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <h1 class="title">袁磊 · Media Query 布局</h1>
        <section class="box-grid" aria-label="八个响应式盒子">
            <div class="box">盒子 1</div>
            <div class="box">盒子 2</div>
            <div class="box">盒子 3</div>
            <div class="box">盒子 4</div>
            <div class="box">盒子 5</div>
            <div class="box">盒子 6</div>
            <div class="box">盒子 7</div>
            <div class="box">盒子 8</div>
        </section>
    </main>
</body>
</html>
