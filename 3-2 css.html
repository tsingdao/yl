<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>526袁磊</title>
    <style>
        p{
            color:#94a;
            font-size:50px;
        }
        /* 标签选择器 */
        #box{
            width:600px;
            height:500px;
            background-color: #ccc;
        }
/* id选择器，以#开头 */
    .n1{
        color:blue;
    }
    /* 类选择器，以.开头 */
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS选择器</p> 
        <p><span class="n1">袁</span>磊</p>
        <p>CSS属性</p>
    </div>
    <!-- 扩展1：名字的每个字不同颜色，在同一行 -->
     <!-- 扩展2：h2黑底白字 -->
      <!-- 扩展三：选择器三个字是白色   或   新增一个宽300高300的盒子，有背景颜色 -->
</body>
</html>
